# ===========================================================================================
# 10am slot. Publish target: 10:00 Asia/Karachi minus 20 min = 04:40 UTC.
# GitHub cron runs in UTC and the times are EXPECTED times: runs are often delayed 5-15 min
# (worse at the top of the hour, which is one reason we start 20 min early).
# The time-verification job skips the run if it starts more than 15 min late and sends a
# "delayed skip" notification. If you need exact timing, use an external cron service
# (e.g. cron-job.org free tier) to call the workflow_dispatch API, and set LEAD_MINUTES=0.
# GENERATED by tools/gen_workflows.py. Edit the generator, not this file.
# ===========================================================================================
name: video-10am

on:
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate and render only, do not publish"
        type: boolean
        default: false

permissions:
  contents: write   # commits data/history.json + STATUS.md

concurrency:
  group: shorts-pipeline      # the four slots never run at the same time
  cancel-in-progress: false

env:
  SLOT: "10am"
  LOCAL_TZ: "Asia/Karachi"
  LEAD_MINUTES: "20"
  MAX_DELAY_MINUTES: "15"

jobs:
  guard:
    name: Time verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    outputs:
      run: ${{ steps.guard.outputs.run }}
      message: ${{ steps.guard.outputs.message }}
      target_iso: ${{ steps.guard.outputs.target_iso }}
    steps:
      - uses: actions/checkout@v4
      - name: Check this run started on time
        id: guard
        run: python3 -m shorts.timeguard --slot "$SLOT"
      - name: Build skip alert text
        if: steps.guard.outputs.run == 'false'
        id: skipinfo
        env:
          ALERT_KIND: skip
          ALERT_EXTRA: ${{ steps.guard.outputs.message }}
        run: python3 -m shorts.alert_info
      - name: Email "delayed skip"
        if: steps.guard.outputs.run == 'false' && env.SMTP_SERVER != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.skipinfo.outputs.subject }}
          body: ${{ steps.skipinfo.outputs.body }}
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: Shorts bot <${{ secrets.SMTP_USERNAME }}>
      - name: Slack "delayed skip"
        if: steps.guard.outputs.run == 'false' && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {"text": ${{ toJSON(steps.skipinfo.outputs.subject) }}}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  make-and-publish:
    name: Generate, render, publish
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET_ISO: ${{ needs.guard.outputs.target_iso }}
      DRY_RUN: ${{ inputs.dry_run }}
      HC_URL: ${{ secrets.HC_URL_10AM }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YT_OAUTH_JSON: ${{ secrets.YT_OAUTH_JSON }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_MODE: ${{ vars.TIKTOK_MODE }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_TOKEN_ISSUED: ${{ vars.IG_TOKEN_ISSUED }}
      CATBOX_USERHASH: ${{ secrets.CATBOX_USERHASH }}
      GH_PAT: ${{ secrets.GH_PAT }}
      PLATFORMS: ${{ vars.PLATFORMS }}
      YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        id: apt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Cache Whisper model (karaoke captions)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-tiny-v1

      - name: Install Python packages (ShortSmash etc.)
        id: pip
        run: pip install -r requirements.txt

      - name: Healthchecks start ping
        id: hc_start
        continue-on-error: true
        run: python -m shorts.healthchecks start

      - name: Generate script, render video, publish
        id: run
        run: python -m shorts.run --slot "$SLOT"

      - name: Commit status page
        id: commit
        if: always()
        continue-on-error: true
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add data/history.json STATUS.md
          git diff --cached --quiet || git commit -m "status: 10am run [skip ci]"
          git pull --rebase --autostash
          git push

      - name: Healthchecks success ping
        if: steps.run.outcome == 'success'
        run: python -m shorts.healthchecks success "10am ok"

      - name: Instagram token reminder
        if: always() && steps.run.outputs.reminder != ''
        id: reminder
        env:
          ALERT_KIND: reminder
          ALERT_EXTRA: ${{ steps.run.outputs.reminder }}
        run: python -m shorts.alert_info

      - name: Email reminder
        if: always() && steps.reminder.outcome == 'success' && env.SMTP_SERVER != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.reminder.outputs.subject }}
          body: ${{ steps.reminder.outputs.body }}
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: Shorts bot <${{ secrets.SMTP_USERNAME }}>

      - name: Slack reminder
        if: always() && steps.reminder.outcome == 'success' && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {"text": ${{ toJSON(steps.reminder.outputs.body) }}}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      # ---------------------------- failure handling ----------------------------
      - name: Healthchecks fail ping
        if: failure()
        run: python -m shorts.healthchecks fail "10am failed, see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Build failure alert text
        if: failure()
        id: alert
        env:
          ALERT_KIND: failure
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python -m shorts.alert_info

      - name: Email failure alert
        if: failure() && env.SMTP_SERVER != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.alert.outputs.subject }}
          body: ${{ steps.alert.outputs.body }}
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: Shorts bot <${{ secrets.SMTP_USERNAME }}>

      - name: Slack failure alert
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {"text": ${{ toJSON(steps.alert.outputs.body) }}}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
